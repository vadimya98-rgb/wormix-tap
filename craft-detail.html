<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Сборка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <a href="craft.html" class="btn-back">← К рецептам</a>
        <div class="balance">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    <div class="content">
        <div class="craft-result">
            <img src="images/hat_legend.png" style="width:80px; height:80px; object-fit:contain;">
            <div style="text-align:left;">
                <h3 style="margin:0;">Легендарная Шапка</h3>
                <p style="margin:0; font-size:12px; color:#FFD700;">Шанс: 2%</p>
            </div>
        </div>
        
        <div class="ingredient">
            <img src="images/hat_novice.png" class="item-icon" style="width:40px; height:40px; margin-right:10px;">
            <span style="flex-grow:1;">Шапка Новичка</span>
            <button id="btn-hat1" class="btn-buy" onclick="window.location.href='hats.html'">В магазин</button>
        </div>
        <div class="ingredient">
            <img src="images/hat_warrior.png" class="item-icon" style="width:40px; height:40px; margin-right:10px;">
            <span style="flex-grow:1;">Шапка Воина</span>
            <button id="btn-hat2" class="btn-buy" onclick="window.location.href='hats.html'">В магазин</button>
        </div>

        <button id="btn-craft" class="btn-green" style="display:none; margin-top:20px; align-items:center; justify-content:center; gap:8px;" onclick="doCraft()">Собрать</button>
        
        <!-- Блок для вывода результата крафта -->
        <div id="craft-result-text" style="text-align:center; margin-top:20px; font-weight:bold; font-size:18px; text-shadow: 1px 1px 2px black;"></div>
    </div>

    <script src="script.js"></script>
    <script>
        updateBalanceUI();
        let craftPrice = player.craftsCount === 0 ? 4000 : 6000;

        if(player.hats.includes('hat1')) document.getElementById('btn-hat1').style.display = 'none';
        if(player.hats.includes('hat2')) document.getElementById('btn-hat2').style.display = 'none';
        
        if (player.hats.includes('hat1') && player.hats.includes('hat2')) {
            let btn = document.getElementById('btn-craft');
            btn.style.display = 'flex';
            btn.innerHTML = `Собрать (${craftPrice} <img src="images/fuz.png" class="coin-icon" style="width:20px; height:20px; margin:0;">)`;
        }

        function doCraft() {
            if (player.fuzes < craftPrice) {
                showToast("Недостаточно фузов для сборки!", true);
                return;
            }
            player.fuzes -= craftPrice;
            player.craftsCount += 1; 
            
            let success = Math.random() < 0.02;
            let resultText = document.getElementById('craft-result-text');
            
            if (success) {
                resultText.style.color = "#FFD700";
                resultText.innerText = "🎉 ПОЗДРАВЛЯЮ! ВЫПАЛА ЛЕГЕНДАРНАЯ ШАПКА! 🎉";
                if (!player.hats.includes('hat_legend')) player.hats.push('hat_legend');
            } else {
                resultText.style.color = "#FF5252";
                resultText.innerText = "Увы, шапка сломалась. Ингредиенты остались у вас.";
            }
            
            saveGame();
            updateBalanceUI();
            
            // Обновляем кнопку, так как цена пересборки теперь 6000
            let btn = document.getElementById('btn-craft');
            btn.innerHTML = `Собрать (6000 <img src="images/fuz.png" class="coin-icon" style="width:20px; height:20px; margin:0;">)`;
        }
    </script>
</body>
</html>
