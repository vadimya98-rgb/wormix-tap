<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">☰ Меню</a>
        <div class="balance">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    <div id="ui-boost-timer" style="color:#FFEB3B; text-align:center; height:20px; font-weight:bold; text-shadow: 1px 1px 2px black;"></div>
    
    <div class="character-area" id="tap-area" onpointerdown="tap(event)">
        <div class="character-container">
            <img class="character" id="character" src="">
            <img id="equipped-hat" src="">
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('character').src = player.race;
        
        if(player.hats.includes('hat2')) {
            let hat = document.getElementById('equipped-hat');
            hat.src = 'images/hat_warrior.png';
            hat.style.display = 'block';
        } else if (player.hats.includes('hat1')) {
            let hat = document.getElementById('equipped-hat');
            hat.src = 'images/hat_novice.png';
            hat.style.display = 'block';
        }

        updateBalanceUI();
        startTimerUI('ui-boost-timer');

        function tap(event) {
            let earned = 5 * getCurrentMultiplier();
            player.fuzes += earned;
            
            let isRuby = Math.random() < 0.01; // 1%
            if (isRuby) player.rubies += 1;

            updateBalanceUI();
            saveGame();
            
            let clientX = event.clientX;
            let clientY = event.clientY;
            
            let text = document.createElement('div');
            text.className = 'floating-text';
            
            // Используем innerHTML, чтобы вставить картинку вместо смайлика
            if (isRuby) {
                text.innerHTML = `+1 <img src="images/rubin.png">`;
            } else {
                text.innerHTML = `+${earned} <img src="images/fuz.png">`;
            }
            
            text.style.left = (clientX - 30) + 'px';
            text.style.top = (clientY - 30) + 'px';
            
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);
        }
    </script>
</body>
</html>
