<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Расса</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">← Назад</a>
        <div class="balance"><div>💎 <span id="ui-fuzes">0</span></div></div>
    </div>
    <div class="content">
        <h3 style="text-align:center; text-shadow: 1px 1px 2px black;">Смена рассы стоит 1500 фузов</h3>
        <div class="race-grid" style="margin-top:20px;">
            <div class="race-wrapper" onclick="changeRace('images/dragon.png')"><img src="images/dragon.png" class="race-img"></div>
            <div class="race-wrapper" onclick="changeRace('images/robot.png')"><img src="images/robot.png" class="race-img"></div>
            <div class="race-wrapper" onclick="changeRace('images/demon.png')"><img src="images/demon.png" class="race-img"></div>
            <div class="race-wrapper" onclick="changeRace('images/cat.png')"><img src="images/cat.png" class="race-img"></div>
            <div class="race-wrapper" onclick="changeRace('images/zombie.png')"><img src="images/zombie.png" class="race-img"></div>
            <div class="race-wrapper" onclick="changeRace('images/dog.png')"><img src="images/dog.png" class="race-img"></div>
            <div class="race-wrapper" onclick="changeRace('images/rabit.png')"><img src="images/rabit.png" class="race-img"></div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        updateBalanceUI();
        function changeRace(newRace) {
            if (newRace === player.race) { alert("У вас уже выбрана эта раса!"); return; }
            if (player.fuzes >= 1500) {
                player.fuzes -= 1500;
                player.race = newRace;
                saveGame();
                updateBalanceUI();
                alert("Раса успешно изменена!");
            } else {
                alert("Недостаточно фузов (нужно 1500)!");
            }
        }
    </script>
</body>
</html>
