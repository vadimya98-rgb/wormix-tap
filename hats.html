<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шапки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">← Назад</a>
        <div class="balance">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    <div class="content">
        <div class="item-card" id="card-hat1">
            <img src="images/hat_novice.png" class="item-icon">
            <div style="flex-grow:1;"><b>Шапка Новичка</b><br><span style="color:#aaa; font-size:12px;">500 <img src="images/fuz.png" class="coin-icon" style="width:14px; height:14px;"></span></div>
            <button class="btn-buy" onclick="buyItem('hat1', 500)">
                500 <img src="images/fuz.png" class="coin-icon" style="width:16px; height:16px; margin:0;">
            </button>
        </div>
        <div class="item-card" id="card-hat2">
            <img src="images/hat_warrior.png" class="item-icon">
            <div style="flex-grow:1;"><b>Шапка Воина</b><br><span style="color:#aaa; font-size:12px;">1000 <img src="images/fuz.png" class="coin-icon" style="width:14px; height:14px;"></span></div>
            <button class="btn-buy" onclick="buyItem('hat2', 1000)">
                1000 <img src="images/fuz.png" class="coin-icon" style="width:16px; height:16px; margin:0;">
            </button>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        updateBalanceUI();
        
        // СКРЫВАЕМ КУПЛЕННЫЕ ШАПКИ ИЗ МАГАЗИНА
        if(player.hats.includes('hat1')) document.getElementById('card-hat1').style.display = 'none';
        if(player.hats.includes('hat2')) document.getElementById('card-hat2').style.display = 'none';

        function buyItem(id, price) {
            if (player.fuzes >= price) {
                player.fuzes -= price;
                if(!player.hats.includes(id)) {
                    player.hats.push(id);
                    player.hatTiers[id] = 0; // Задаем начальный уровень
                }
                saveGame();
                updateBalanceUI();
                showToast("Куплено!");
                
                // Прячем карточку сразу после покупки
                document.getElementById('card-' + id).style.display = 'none';
            } else { 
                showToast("Недостаточно средств!", true); 
            }
        }
    </script>
</body>
</html>
