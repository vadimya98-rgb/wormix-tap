<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шапки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">← Назад</a>
        <div class="balance"><div>💎 <span id="ui-fuzes">0</span></div></div>
    </div>
    <div class="content">
        <!-- Пример карточки -->
        <div class="item-card">
            <div><b>Шапка Новичка</b><br><span style="color:#aaa; font-size:12px;">500 💎</span></div>
            <button class="btn-buy" onclick="buyItem('hat1', 500)">Купить</button>
        </div>
        <div class="item-card">
            <div><b>Шапка Воина</b><br><span style="color:#aaa; font-size:12px;">1000 💎</span></div>
            <button class="btn-buy" onclick="buyItem('hat2', 1000)">Купить</button>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        updateBalanceUI();
        function buyItem(id, price) {
            if (player.fuzes >= price) {
                player.fuzes -= price;
                if(!player.hats.includes(id)) player.hats.push(id);
                saveGame();
                updateBalanceUI();
                alert("Куплено! Теперь доступно в Крафте.");
            } else { alert("Мало фузов!"); }
        }
    </script>
</body>
</html>
