name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          rm -rf cordova-app/www/*
          if [ -d "web" ]; then cp -a web/. cordova-app/www/; fi
          if [ -d "веб" ]; then cp -a веб/. cordova-app/www/; fi
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          mkdir -p cordova-app/www/images
          if [ -d "images" ]; then cp -a images/. cordova-app/www/images/; fi
          if [ -d "изображения" ]; then cp -a изображения/. cordova-app/www/images/; fi
          if [ -d "web/images" ]; then cp -a web/images/. cordova-app/www/images/; fi

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android@12

      # ЖЕСТКАЯ ЗАЧИСТКА И УСТАНОВКА ТВОЕЙ ИКОНКИ
      - name: Bruteforce Icon Replacement
        run: |
          if [ -f icon.png ]; then
            cd cordova-app/platforms/android/app/src/main/res
            
            # Полностью удаляем старые иконки
            rm -rf mipmap-*
            
            # Создаем папки заново
            mkdir -p mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi
            
            # Копируем твою иконку во все папки
            cp $GITHUB_WORKSPACE/icon.png mipmap-mdpi/ic_launcher.png
            cp $GITHUB_WORKSPACE/icon.png mipmap-hdpi/ic_launcher.png
            cp $GITHUB_WORKSPACE/icon.png mipmap-xhdpi/ic_launcher.png
            cp $GITHUB_WORKSPACE/icon.png mipmap-xxhdpi/ic_launcher.png
            cp $GITHUB_WORKSPACE/icon.png mipmap-xxxhdpi/ic_launcher.png
          fi

      # СБОРКА НАПРЯМУЮ ЧЕРЕЗ GRADLE (без команд cordova build)
      - name: Build APK directly with Gradle
        run: |
          cd cordova-app/platforms/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
