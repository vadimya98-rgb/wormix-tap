name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Этот шаг автоматически переносит папку images внутрь web
      - name: Move images to web
        run: |
          if [ -d "images" ]; then
            mv images web/
          fi

      - name: Build APK from Web
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "web"
          app-name: "Wormix Tap"
          output-folder-path: "apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTap-APK
          path: apk/
