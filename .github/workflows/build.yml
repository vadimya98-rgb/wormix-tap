name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova and cordova-res
        run: npm install -g cordova cordova-res

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          cp -r web/* cordova-app/www/ 2>/dev/null || true
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          cp -r images cordova-app/www/ 2>/dev/null || true

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android

      # БЛОК ГЕНЕРАЦИИ ИКОНКИ И ЗАСТАВКИ
      - name: Generate Icons and Splash
        run: |
          mkdir -p cordova-app/resources
          if [ -f icon.png ]; then
            # Копируем иконку
            cp icon.png cordova-app/resources/icon.png
            # Устанавливаем ImageMagick для создания заставки
            sudo apt-get update && sudo apt-get install -y imagemagick
            # Создаем splash.png 2732x2732 с иконкой по центру
            convert icon.png -resize 2732x2732^ -gravity center -extent 2732x2732 cordova-app/resources/splash.png
          fi
          cd cordova-app
          cordova-res android --skip-config --copy

      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
