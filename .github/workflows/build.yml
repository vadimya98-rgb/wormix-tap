name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ОФИЦИАЛЬНЫЙ ИНСТРУМЕНТ GITHUB ДЛЯ УСТАНОВКИ ПРАВИЛЬНОГО GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install Cordova, cordova-res, ImageMagick
        run: |
          npm install -g cordova cordova-res
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          rm -rf cordova-app/www/*
          cp -a web/. cordova-app/www/
          mkdir -p cordova-app/www/images
          cp -a images/. cordova-app/www/images/

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android@12

      # ГЕНЕРАЦИЯ ИКОНКИ (Создаем splash, чтобы cordova-res не падал)
      - name: Generate Icons
        run: |
          cd cordova-app
          mkdir -p resources
          if [ -f "../icon.png" ]; then
            cp ../icon.png resources/icon.png
            # Создаем картинку заставки из иконки
            convert ../icon.png -resize 2732x2732^ -gravity center -extent 2732x2732 resources/splash.png
          fi
          # Автоматически генерируем все размеры иконок для Android
          cordova-res android --skip-config --copy

      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
