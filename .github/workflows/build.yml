name: Build Android APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ДОБАВЛЕН @capacitor/status-bar
      - name: Install Capacitor CLI and Core
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets @capacitor/status-bar@7

      - name: Prepare Game Files
        run: |
          mkdir -p www
          if [ -d "web" ]; then cp -a web/. www/; fi
          if [ -d "веб" ]; then cp -a веб/. www/; fi
          if [ -d "docs" ]; then cp -a docs/. www/; fi
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          mkdir -p www/images
          if [ -d "images" ]; then cp -a images/. www/images/; fi
          if [ -d "изображения" ]; then cp -a изображения/. www/images/; fi
          if [ -d "web/images" ]; then cp -a web/images/. www/images/; fi

      - name: Create Capacitor Config
        run: |
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.example.wormixtap",
            "appName": "WormixTAP",
            "webDir": "www"
          }
          EOF

      - name: Add Android Platform
        run: npx cap add android

      - name: Generate App Icons and Splash
        run: |
          mkdir -p assets
          if [ -f "icon.png" ]; then cp icon.png assets/icon.png 2>/dev/null || true; fi
          if [ -f "splash.png" ]; then cp splash.png assets/splash.png 2>/dev/null || true; fi
          npx @capacitor/assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
