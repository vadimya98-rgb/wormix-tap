name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Устанавливаем стабильную версию Node.js (16), чтобы избежать ошибок npm
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # 2. Автоматически переносим все файлы игры в папку web
      - name: Move all game files to web folder
        run: |
          [ -f index.html ] && mv index.html web/ || true
          [ -f game.html ] && mv game.html web/ || true
          [ -f menu.html ] && mv menu.html web/ || true
          [ -f race.html ] && mv race.html web/ || true
          [ -f shop.html ] && mv shop.html web/ || true
          [ -f hats.html ] && mv hats.html web/ || true
          [ -f artifacts.html ] && mv artifacts.html web/ || true
          [ -f craft.html ] && mv craft.html web/ || true
          [ -f craft-detail.html ] && mv craft-detail.html web/ || true
          [ -f wardrobe.html ] && mv wardrobe.html web/ || true
          [ -f style.css ] && mv style.css web/ || true
          [ -f script.js ] && mv script.js web/ || true
          [ -d images ] && mv images web/ || true

      # 3. Собираем APK
      - name: Build APK from Web
        uses: darkshredder/web-to-app-action@main
        with:
          build-folder-path: "web"
          app-name: "Wormix Tap"
          output-folder-path: "apk"

      # 4. Сохраняем готовый файл
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTap-APK
          path: apk/
