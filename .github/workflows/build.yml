name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova, Gradle and ImageMagick
        run: |
          npm install -g cordova
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d /opt/
          export PATH=$PATH:/opt/gradle-8.13/bin
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          rm -rf cordova-app/www/*
          if [ -d "web" ]; then cp -a web/. cordova-app/www/; fi
          if [ -d "docs" ]; then cp -a docs/. cordova-app/www/; fi
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          mkdir -p cordova-app/www/images
          if [ -d "images" ]; then cp -a images/. cordova-app/www/images/; fi
          if [ -d "web/images" ]; then cp -a web/images/. cordova-app/www/images/; fi

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android@13

      # ИСПРАВЛЕННЫЙ ШАГ: Полная зачистка старых иконок
      - name: Replace Icons Directly
        run: |
          if [ -f icon.png ]; then
            REPO_ROOT=$(pwd)
            cd cordova-app/platforms/android/app/src/main/res
            
            # 1. Удаляем адаптивные XML-иконки, чтобы не было конфликта типов
            rm -rf mipmap-anydpi-v26
            
            # 2. Удаляем ВСЕ старые PNG-файлы иконок во всех папках
            find . -name "ic_launcher.png" -delete
            find . -name "ic_launcher_round.png" -delete
            find . -name "ic_launcher_foreground.png" -delete
            
            # 3. Генерируем и копируем новые иконки нужных размеров
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                case $dir in
                  mipmap-mdpi) size=48 ;;
                  mipmap-hdpi) size=72 ;;
                  mipmap-xhdpi) size=96 ;;
                  mipmap-xxhdpi) size=144 ;;
                  mipmap-xxxhdpi) size=192 ;;
                esac
                convert "$REPO_ROOT/icon.png" -resize ${size}x${size} $dir/ic_launcher.png
                convert "$REPO_ROOT/icon.png" -resize ${size}x${size} $dir/ic_launcher_round.png
              fi
            done
          fi

      - name: Build Debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-8.13-bin.zip
        run: |
          cd cordova-app
          export PATH=$PATH:/opt/gradle-8.13/bin
          cordova clean
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
