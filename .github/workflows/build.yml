name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "Wormix Tap"

      - name: Copy Game Files to Cordova
        run: |
          # Копируем все файлы из папки web (или из корня, если они там) в www Cordova
          cp -r web/* cordova-app/www/ 2>/dev/null || true
          cp index.html cordova-app/www/ 2>/dev/null || true
          cp game.html cordova-app/www/ 2>/dev/null || true
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          cp -r images cordova-app/www/ 2>/dev/null || true
          cp -r web/images cordova-app/www/ 2>/dev/null || true

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android

      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTap-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
