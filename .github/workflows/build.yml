name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ЖЕСТКО СТАВИМ ПРАВИЛЬНУЮ ВЕРСИЮ GRADLE ДЛЯ СИСТЕМЫ
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Install Cordova and cordova-res
        run: |
          npm install -g cordova cordova-res

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          rm -rf cordova-app/www/*
          if [ -d "web" ]; then cp -a web/. cordova-app/www/; fi
          if [ -d "веб" ]; then cp -a веб/. cordova-app/www/; fi
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          mkdir -p cordova-app/www/images
          if [ -d "images" ]; then cp -a images/. cordova-app/www/images/; fi
          if [ -d "изображения" ]; then cp -a изображения/. cordova-app/www/images/; fi
          if [ -d "web/images" ]; then cp -a web/images/. cordova-app/www/images/; fi

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android@12

      # КОПИРУЕМ ОБЕ КАРТИНКИ В ПАПКУ РЕСУРСОВ
      - name: Prepare Resources
        run: |
          cd cordova-app
          mkdir -p resources
          if [ -f "../icon.png" ]; then cp ../icon.png resources/icon.png; fi
          if [ -f "../splash.png" ]; then cp ../splash.png resources/splash.png; fi

      # ГЕНЕРИРУЕМ ИКОНКИ И ЗАСТАВКИ (теперь ошибки не будет)
      - name: Generate Icons and Splash
        run: |
          cd cordova-app
          cordova-res android --skip-config --copy

      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
