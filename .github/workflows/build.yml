name: Build Android APK with Capacitor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 1: Устанавливаем Node.js (Capacitor требует современную версию)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Шаг 2: Устанавливаем зависимости Capacitor
      - name: Install Capacitor Dependencies
        run: |
          npm i @capacitor/core
          npm i -D @capacitor/cli
          npm i @capacitor/android

      # Шаг 3: Копируем файлы игры в папку www (стандарт для Capacitor)
      - name: Copy Game Files to www
        run: |
          rm -rf www/*
          mkdir -p www
          if [ -d "web" ]; then cp -a web/. www/; fi
          if [ -d "веб" ]; then cp -a веб/. www/; fi
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          mkdir -p www/images
          if [ -d "images" ]; then cp -a images/. www/images/; fi
          if [ -d "изображения" ]; then cp -a изображения/. www/images/; fi
          if [ -d "web/images" ]; then cp -a web/images/. www/images/; fi

      # Шаг 4: Запускаем магию экшена (он сам все соберет)
      - name: Build APK
        uses: Narottam04/action-capacitor-android@master
        with:
          # Указываем, что игра лежит в папке www
          default-directory: './www'
          # Указываем имя приложения (можно поменять на WormixTAP)
          app-name: 'WormixTAP'
          # Указываем путь к нашим картинкам для иконки и заставки
          resources-path: './'

      # Шаг 5: Сохраняем готовый APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
