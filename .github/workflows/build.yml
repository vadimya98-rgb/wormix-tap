name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova and ImageMagick
        run: |
          npm install -g cordova
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          [ -d "веб" ] && mv веб web || true
          [ -d "изображения" ] && mv изображения images || true
          cp -r web/* cordova-app/www/ 2>/dev/null || true
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          cp -r images cordova-app/www/ 2>/dev/null || true

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android

      # ПРЯМАЯ ЗАМЕНА ИКОНОК (БЕЗ СТОРОННИХ БИБЛИОТЕК)
      - name: Replace Icons Directly
        run: |
          if [ -f icon.png ]; then
            cd cordova-app/platforms/android/app/src/main/res
            for dir in mipmap-*; do
              if [ -d "$dir" ]; then
                # Принудительно перезаписываем все иконки на нашу
                convert ../../../../../../icon.png -resize 48x48 $dir/ic_launcher.png 2>/dev/null || true
                convert ../../../../../../icon.png -resize 48x48 $dir/ic_launcher_round.png 2>/dev/null || true
                convert ../../../../../../icon.png -resize 48x48 $dir/ic_launcher_foreground.png 2>/dev/null || true
              fi
            done
          fi

      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
