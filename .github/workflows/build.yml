name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova, Gradle, and ImageMagick
        run: |
          npm install -g cordova
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d /opt/
          export PATH=$PATH:/opt/gradle-8.13/bin
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          rm -rf cordova-app/www/*
          cp -a web/. cordova-app/www/
          mkdir -p cordova-app/www/images
          cp -a images/. cordova-app/www/images/

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android@12

      # ПРОСТАЯ И НАДЕЖНАЯ ЗАМЕНА ИКОНОК
      - name: Replace Icons Directly
        run: |
          if [ -f icon.png ]; then
            REPO_ROOT=$(pwd)
            cd cordova-app/platforms/android/app/src/main/res
            
            # Удаляем адаптивные XML-иконки
            rm -rf mipmap-anydpi-v26
            
            # Нарезаем иконку под все размеры экранов
            convert "$REPO_ROOT/icon.png" -resize 48x48 mipmap-mdpi/ic_launcher.png
            convert "$REPO_ROOT/icon.png" -resize 48x48 mipmap-mdpi/ic_launcher_round.png
            
            convert "$REPO_ROOT/icon.png" -resize 72x72 mipmap-hdpi/ic_launcher.png
            convert "$REPO_ROOT/icon.png" -resize 72x72 mipmap-hdpi/ic_launcher_round.png
            
            convert "$REPO_ROOT/icon.png" -resize 96x96 mipmap-xhdpi/ic_launcher.png
            convert "$REPO_ROOT/icon.png" -resize 96x96 mipmap-xhdpi/ic_launcher_round.png
            
            convert "$REPO_ROOT/icon.png" -resize 144x144 mipmap-xxhdpi/ic_launcher.png
            convert "$REPO_ROOT/icon.png" -resize 144x144 mipmap-xxhdpi/ic_launcher_round.png
            
            convert "$REPO_ROOT/icon.png" -resize 192x192 mipmap-xxxhdpi/ic_launcher.png
            convert "$REPO_ROOT/icon.png" -resize 192x192 mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Build Debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-8.13-bin.zip
        run: |
          cd cordova-app
          export PATH=$PATH:/opt/gradle-8.13/bin
          cordova clean
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
