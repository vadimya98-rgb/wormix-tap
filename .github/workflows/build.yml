name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ЖЕСТКО СТАВИМ ПРАВИЛЬНУЮ ВЕРСИЮ GRADLE
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # УСТАНАВЛИВАЕМ IMAGEMAGICK ДЛЯ РАБОТЫ С КАРТИНКАМИ
      - name: Install Cordova, cordova-res and ImageMagick
        run: |
          npm install -g cordova cordova-res
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      - name: Copy Game Files to Cordova
        run: |
          rm -rf cordova-app/www/*
          if [ -d "web" ]; then cp -a web/. cordova-app/www/; fi
          if [ -d "веб" ]; then cp -a веб/. cordova-app/www/; fi
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          mkdir -p cordova-app/www/images
          if [ -d "images" ]; then cp -a images/. cordova-app/www/images/; fi
          if [ -d "изображения" ]; then cp -a изображения/. cordova-app/www/images/; fi
          if [ -d "web/images" ]; then cp -a web/images/. cordova-app/www/images/; fi

      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android@12

      # АВТОМАТИЧЕСКОЕ УВЕЛИЧЕНИЕ ЗАСТАВКИ ДО 2732x2732
      - name: Prepare Resources
        run: |
          cd cordova-app
          mkdir -p resources
          if [ -f "../icon.png" ]; then cp ../icon.png resources/icon.png; fi
          if [ -f "../splash.png" ]; then 
            # Увеличиваем картинку до 2732x2732, чтобы cordova-res была довольна
            convert ../splash.png -resize 2732x2732^ -gravity center -extent 2732x2732 resources/splash.png
          fi

      - name: Generate Icons and Splash
        run: |
          cd cordova-app
          cordova-res android --skip-config --copy

      # ОЧИСТКА И СБОРКА
      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova clean
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
