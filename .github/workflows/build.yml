name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Жестко ставим Java 17 (требование Cordova 12+)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova and ImageMagick
        run: |
          npm install -g cordova
          sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create Cordova Project
        run: cordova create cordova-app com.example.wormixtap "WormixTAP"

      # 2. Копируем ВСЕ файлы игры
      - name: Copy Game Files to Cordova
        run: |
          rm -rf cordova-app/www/*
          if [ -d "web" ]; then cp -a web/. cordova-app/www/; fi
          if [ -d "docs" ]; then cp -a docs/. cordova-app/www/; fi
          cp *.html cordova-app/www/ 2>/dev/null || true
          cp *.css cordova-app/www/ 2>/dev/null || true
          cp *.js cordova-app/www/ 2>/dev/null || true
          mkdir -p cordova-app/www/images
          if [ -d "images" ]; then cp -a images/. cordova-app/www/images/; fi
          if [ -d "web/images" ]; then cp -a web/images/. cordova-app/www/images/; fi

      # 3. Добавляем платформу Android 13 (она стабильнее)
      - name: Add Android Platform
        run: |
          cd cordova-app
          cordova platform add android@13

      - name: Replace Icons Directly
        run: |
          if [ -f icon.png ]; then
            REPO_ROOT=$(pwd)
            cd cordova-app/platforms/android/app/src/main/res
            rm -rf mipmap-anydpi-v26
            for dir in mipmap-*; do
              if [ -d "$dir" ]; then
                convert "$REPO_ROOT/icon.png" -resize 48x48 $dir/ic_launcher.png 2>/dev/null || true
                convert "$REPO_ROOT/icon.png" -resize 48x48 $dir/ic_launcher_round.png 2>/dev/null || true
              fi
            done
          fi

      # 4. ОЧИЩАЕМ И СОБИРАЕМ С ГРАДЛ 8.13
      - name: Build Debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-8.13-bin.zip
        run: |
          cd cordova-app
          cordova clean
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormixTAP-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
