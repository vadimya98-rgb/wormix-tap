<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Вормикс ТАП</title>
    <link rel="stylesheet" href="style.css?v=68">
</head>
<body>
    <div id="s1" class="screen active">
        <div class="intro-text">Приветствую тебя в игре<br><b>Вормикс ТАП</b></div>
        <button class="btn-green" onclick="showScreen('s2')">Далее</button>
    </div>
    
    <div id="s2" class="screen">
        <div class="intro-text">В этой игре тебе предстоит выбивать фузы и рубины, чтобы одевать своего персонажа.<br><br>Покупай шапки и артефакты, открывай новые рассы.</div>
        <button class="btn-green" onclick="startGame()">Начать игру!</button>
    </div>
    
    <script src="script.js?v=68"></script>
    <script>
        // Если игрок уже играл, сразу кидаем в игру
        if (player && player.race && player.race !== '') {
            window.location.href = 'game.html';
        }
        
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
        
        function startGame() {
            // Автоматически выдаем Дракона
            player.race = 'images/dragon.png';
            if (!player.unlockedRaces.includes('images/dragon.png')) {
                player.unlockedRaces.push('images/dragon.png');
            }
            saveGame();
            window.location.href = 'game.html';
        }
    </script>
    <script>
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
            window.Capacitor.Plugins.StatusBar.hide();
        }
    </script>
</body>
</html>
