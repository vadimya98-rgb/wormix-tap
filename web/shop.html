<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Магазин</title>
    <link rel="stylesheet" href="style.css?v=32">
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">← Назад</a>
        <div class="balance"><div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div></div>
    </div>
    <div class="content" id="shop-list"></div>

    <script src="script.js?v=32"></script>
    <script>
        updateBalanceUI();
        const boosts = [
            { name: 'x10 Буст (10 мин)', cost: 50, mult: 10, time: 10, highlight: true },
            { name: 'x20 Буст (10 мин)', cost: 100, mult: 20, time: 10, highlight: true }
        ];

        let list = document.getElementById('shop-list');
        boosts.forEach((b, i) => {
            let bg = b.highlight ? 'style="border: 2px solid #FFD700; background: rgba(255, 215, 0, 0.1);"' : '';
            list.innerHTML += `
                <div class="item-card" ${bg}>
                    <div>
                        <b>${b.name}</b><br>
                        <span style="font-size:12px; color:#aaa;">Множитель фузов: x${b.mult}</span>
                    </div>
                    <button class="btn-buy" onclick="buyBoost(${i})" style="background:#FF9800;">
                        ${b.cost} <img src="images/rubin.png" class="coin-icon" style="width:16px; height:16px; margin:0;">
                    </button>
                </div>
            `;
        });

        function buyBoost(index) {
    let b = boosts[index];
    if (player.rubies >= b.cost) {
        
        playSound('buy');
        vibrate(50);

        player.rubies -= b.cost;
        player.boostMultiplier = b.mult;
        let now = Date.now();
        if (player.boostEndTime > now) { player.boostEndTime += b.time * 60000; } 
        else { player.boostEndTime = now + (b.time * 60000); }
        saveGame(); updateBalanceUI(); showToast(`Буст x${b.mult} активирован!`);
    } else { 
        playSound('fail'); 
        vibrate([100, 50, 100]);
        showToast("Недостаточно средств!", true); 
    }
}
