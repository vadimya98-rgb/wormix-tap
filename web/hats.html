<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Шапки</title>
    <link rel="stylesheet" href="style.css?v=63">
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">← Назад</a>
        <div class="balance">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    <div class="content" id="shop-list"></div>
    <script src="script.js?v=63"></script>
    <script>
        updateBalanceUI();
        let list = document.getElementById('shop-list');

        // Автоматически берем все шапки из базы и сортируем по цене
        let sortedHats = Object.keys(allHats).sort((a, b) => getItemPrice(a) - getItemPrice(b));

        sortedHats.forEach((id) => {
            if (player.hats.includes(id)) return; 
            let price = getItemPrice(id);
            let bonusText = getItemBonusText(id, 0);
            let priceText = price >= 1000000 ? (price / 1000000) + 'кк' : (price >= 1000 ? (price / 1000) + 'к' : price);

            list.innerHTML += `
                <div class="item-card" id="card-${id}">
                    <img src="${allHats[id].img}" class="item-icon">
                    <div style="flex-grow:1;">
                        <b>${allHats[id].name}</b><br>
                        <span style="color:#4CAF50; font-size:11px;">${bonusText}</span><br>
                        <span style="color:#aaa; font-size:12px;">${priceText} <img src="images/fuz.png" class="coin-icon" style="width:14px; height:14px;"></span>
                    </div>
                    <button class="btn-buy" onclick="buyItem('${id}', ${price})">${priceText} <img src="images/fuz.png" class="coin-icon" style="width:16px; height:16px; margin:0;"></button>
                </div>
            `;
        });
        if (list.innerHTML.trim() === "") list.innerHTML = '<div style="text-align:center; margin-top:20px; color:#888;">Вы скупили все шапки!</div>';

        function buyItem(id, price) {
            if (player.fuzes >= price) {
                playSound('buy'); vibrate(50); 
                player.fuzes -= price; 
                player.hats.push(id); 
                player.hatTiers[id] = 0;
                saveGame(); updateBalanceUI(); showToast("Куплено!");
                let card = document.getElementById('card-' + id);
                if(card) { card.style.opacity = '0'; setTimeout(() => { card.remove(); }, 300); }
            } else { 
                playSound('fail'); vibrate([100, 50, 100]); showToast("Недостаточно средств!", true); 
            }
        }
    </script>
</body>
</html>
