<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крафт</title>
    <link rel="stylesheet" href="style.css?v=42">
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">← Назад</a>
        <div class="balance">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    <div class="content" id="craft-list"></div>

    <script src="script.js?v=42"></script>
    <script>
        updateBalanceUI();
        let list = document.getElementById('craft-list');
        let hasItems = false;

        // Выводим шапки
        player.hats.forEach(id => {
            hasItems = true;
            let tier = player.hatTiers[id] || 0;
            let tierName = tier === 0 ? "Стандарт" : (tier === 1 ? "Бронза" : (tier === 2 ? "Серебро" : (tier === 3 ? "Золото" : "Алмаз")));
            let tierClass = tier === 1 ? 'tier-bronze' : (tier === 2 ? 'tier-silver' : (tier === 3 ? 'tier-gold' : (tier === 4 ? 'tier-diamond' : '')));

            list.innerHTML += `
                <div class="item-card">
                    <img src="${allHats[id].img}" class="item-icon ${tierClass}">
                    <div style="flex-grow:1;">
                        <b>${allHats[id].name}</b><br>
                        <span style="color:#FFD700; font-size:12px;">Редкость: ${tierName}</span>
                    </div>
                    <button class="btn-buy" onclick="window.location.href='craft-detail.html?type=hat&id=${id}'">Крафт</button>
                </div>
            `;
        });

        // Выводим артефакты
        player.artifacts.forEach(id => {
            hasItems = true;
            let tier = player.artifactTiers[id] || 0;
            let tierName = tier === 0 ? "Стандарт" : (tier === 1 ? "Бронза" : (tier === 2 ? "Серебро" : (tier === 3 ? "Золото" : "Алмаз")));
            let tierClass = tier === 1 ? 'tier-bronze' : (tier === 2 ? 'tier-silver' : (tier === 3 ? 'tier-gold' : (tier === 4 ? 'tier-diamond' : '')));

            list.innerHTML += `
                <div class="item-card">
                    <img src="${allArtifacts[id].img}" class="item-icon ${tierClass}">
                    <div style="flex-grow:1;">
                        <b>${allArtifacts[id].name}</b><br>
                        <span style="color:#FFD700; font-size:12px;">Редкость: ${tierName}</span>
                    </div>
                    <button class="btn-buy" onclick="window.location.href='craft-detail.html?type=artifact&id=${id}'">Крафт</button>
                </div>
            `;
        });

        if (!hasItems) {
            list.innerHTML = '<div style="text-align:center; margin-top:20px; color:#888;">У вас пока нет вещей для перекрафта. Купите их в магазине!</div>';
        }
    </script>
</body>
</html>
