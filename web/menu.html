<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Меню</title>
    <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
    <div class="top-bar">
        <a href="game.html" class="btn-back">← В игру</a>
        <!-- ДОБАВЛЕН ID ДЛЯ СЕКРЕТНЫХ КЛИКОВ -->
        <div class="balance" id="secret-balance-menu">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    <div class="content" style="display:flex; flex-direction:column; justify-content:center; gap:10px;">
        <a href="wardrobe.html" class="btn-green" style="background:#9C27B0;">Шкаф</a> 
        <a href="race.html" class="btn-green">Расса</a>
        <a href="hats.html" class="btn-green">Шапки</a>
        <a href="artifacts.html" class="btn-green">Артефакты</a>
        <a href="craft.html" class="btn-green">Крафт</a>
        <a href="shop.html" class="btn-green" style="background:#FF9800;">Буст</a>
    </div>
    <script src="script.js?v=21"></script>
    <script>
        updateBalanceUI();

        // --- СЕКРЕТНОЕ МЕНЮ ТЕПЕРЬ ЗДЕСЬ ---
        let clickCount = 0; let clickTimer;
        document.getElementById('secret-balance-menu').addEventListener('pointerdown', () => {
            clickCount++; clearTimeout(clickTimer);
            if (clickCount >= 5) {
                clickCount = 0;
                // Даем разрешение и перекидываем на главный экран
                sessionStorage.setItem('adminAccess', 'true');
                window.location.href = 'game.html';
            } else { 
                clickTimer = setTimeout(() => { clickCount = 0; }, 1000); 
            }
        });
    </script>
</body>
</html>
