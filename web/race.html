<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Рассы</title>
    <link rel="stylesheet" href="style.css?v=68">
    <style>
        .race-shop-item { background: #2a2a35; border: 2px solid #444; border-radius: 10px; padding: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
        .race-shop-item.active-race { border-color: #4CAF50; background: rgba(76, 175, 80, 0.1); }
        .race-shop-item img { width: 60px; height: 60px; object-fit: contain; }
        .race-info { flex-grow: 1; text-align: left; }
        .race-bonus-text { font-size: 11px; color: #aaa; margin-top: 5px; line-height: 1.3; }
        .btn-race-action { padding: 8px 15px; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; color: white; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="menu.html" class="btn-back">← Назад</a>
        <div class="balance">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    <div class="content" id="races-list"></div>

    <script src="script.js?v=68"></script>
    <script>
        updateBalanceUI();
        let list = document.getElementById('races-list');

        function renderRaces() {
            list.innerHTML = '';
            RACES_CONFIG.forEach(race => {
                let isOwned = player.unlockedRaces.includes(race.id);
                let isActive = player.race === race.id;
                let priceText = race.price >= 1000 ? (race.price / 1000) + 'к' : race.price;
                
                // Описания способностей
                let features = {
                    'images/dragon.png': 'Базовый персонаж. Плавно парит в воздухе.',
                    'images/robot.png': 'Контр-удар каждые 100 кликов (+100 фузов).',
                    'images/demon.png': 'Контр-удар каждые 200 кликов (+5 рубинов).',
                    'images/cat.png': 'Неоновое свечение. Разбрасывает искры каждые 15 кликов.',
                    'images/zombie.png': 'Выпускает зеленое облачко каждые 5 кликов.',
                    'images/dog.png': 'Вращается вокруг оси. Контр-удар каждые 150 кликов (+10к фузов, +5 рубинов).',
                    'images/rabit.png': 'Авто-буст х2 на 5 секунд каждые 250 кликов.'
                };

                let btnHTML = '';
                if (isActive) {
                    btnHTML = `<button class="btn-race-action" style="background:#4CAF50;" disabled>Выбрана</button>`;
                } else if (isOwned) {
                    btnHTML = `<button class="btn-race-action" style="background:#2196F3;" onclick="changeRace('${race.id}')">Выбрать</button>`;
                } else {
                    btnHTML = `<button class="btn-race-action" style="background:#FF9800;" onclick="buyRace('${race.id}', ${race.price})">${priceText} <img src="images/fuz.png" style="width:14px; height:14px; margin-left:5px; vertical-align:middle;"></button>`;
                }

                list.innerHTML += `
                    <div class="race-shop-item ${isActive ? 'active-race' : ''}">
                        <img src="${race.id}">
                        <div class="race-info">
                            <b style="font-size:16px;">${race.name}</b>
                            <div class="race-bonus-text">${features[race.id]}</div>
                        </div>
                        ${btnHTML}
                    </div>
                `;
            });
        }

        function changeRace(raceId) {
            player.race = raceId;
            saveGame();
            renderRaces();
            showToast("Раса изменена!");
        }

        function buyRace(raceId, price) {
            if (player.fuzes >= price) {
                player.fuzes -= price;
                player.unlockedRaces.push(raceId);
                player.race = raceId;
                saveGame();
                updateBalanceUI();
                renderRaces();
                playSound('success');
                showToast("Раса куплена и выбрана!");
            } else {
                playSound('fail');
                showToast("Недостаточно средств!", true);
            }
        }

        renderRaces();
    </script>
</body>
</html>
