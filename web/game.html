<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Игра</title>
    <link rel="stylesheet" href="style.css?v=64">
    <style>
        .admin-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: flex-start; align-items: center; flex-direction: column; overflow-y: auto; padding: 20px 0; }
        .admin-box { background: #222; padding: 15px; border-radius: 10px; border: 2px solid #FF9800; width: 90%; max-width: 400px; text-align: center; margin: auto; }
        .slider-group { display: flex; justify-content: space-between; align-items: center; margin: 5px 0; background: #111; padding: 8px; border-radius: 5px; }
        .slider-group label { width: 70px; text-align: left; font-size: 12px; }
        .slider-group input[type="range"] { flex-grow: 1; margin: 0 10px; }
        .slider-group span { width: 30px; font-size: 12px; text-align: right; }
        .admin-select { width: 100%; padding: 10px; margin-bottom: 10px; background: #333; color: white; border: 1px solid #555; border-radius: 5px; font-size: 16px; }
        #code-output { width: 100%; height: 100px; background: #000; color: #00FF00; font-family: monospace; font-size: 12px; padding: 10px; box-sizing: border-box; margin-top: 10px; border: 1px solid #4CAF50; display: none;}
        #drag-banner { display: none; position: fixed; top: 0; left: 0; width: 100%; background: #4CAF50; color: white; text-align: center; padding: 15px; z-index: 10000; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-size: 14px;}
        #drag-banner button { background: white; color: #4CAF50; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; margin-left: 15px; cursor: pointer; }
        .editing-item { outline: 2px dashed #FFD700; outline-offset: 5px; cursor: grab; touch-action: none; pointer-events: auto !important; z-index: 99 !important; }
    </style>
</head>
<body>
    <div id="drag-banner">1 палец — двигать, 2 пальца — размер <button onclick="finishDragging()">Готово</button></div>
    
    <div class="top-bar">
        <a href="menu.html" class="btn-back">☰ Дом</a>
        <div class="balance">
            <div><img src="images/fuz.png" class="coin-icon"> <span id="ui-fuzes">0</span></div>
            <div><img src="images/rubin.png" class="coin-icon"> <span id="ui-rubies">0</span></div>
        </div>
    </div>
    
    <div id="ui-boost-timer" style="color:#FFEB3B; text-align:center; height:20px; font-weight:bold; text-shadow: 1px 1px 2px black;"></div>
    
    <div class="character-area" id="tap-area" onpointerdown="tap(event)">
        <div class="character-container">
            <div class="character-shadow"></div>
            <img class="character" id="character" src="">
            <img id="equipped-hat" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=">
            <img id="equipped-artifact" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=">
        </div>
    </div>

    <div id="bonus-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 style="margin-top:0; color:#FFD700;">Ежедневный бонус</h2>
            <div class="bonus-grid" id="bonus-days"></div>
            <button id="claim-bonus-btn" class="btn-green" style="margin: 15px auto; width: 80%;">Получить</button>
        </div>
    </div>

    <div id="editor-panel" class="admin-modal">
        <div class="admin-box">
            <h3 style="color:#FF9800; margin-top:0;">Редактор предметов</h3>
            <select id="editor-race-selector" class="admin-select" style="border-color: #FFD700;" onchange="changeEditorRace(this.value)">
                <option value="images/dragon.png">Дракон</option>
                <option value="images/robot.png">Робот</option>
                <option value="images/demon.png">Демон</option>
                <option value="images/cat.png">Кот</option>
                <option value="images/zombie.png">Зомби</option>
                <option value="images/dog.png">Собака</option>
                <option value="images/rabit.png">Заяц</option>
            </select>
            <select id="item-selector" class="admin-select" onchange="loadItemToEditor()"></select>
            <div id="sliders-container"></div>
            <button class="btn-green" style="width:100%; margin:5px 0; background:#4CAF50;" onclick="startDragging()">Двигать пальцем</button>
            <button class="btn-green" style="width:100%; margin:5px 0; background:#2196F3;" onclick="generateCode()">Сгенерировать код</button>
            <textarea id="code-output" readonly></textarea>
            <button class="btn-green" style="width:100%; margin:5px 0;" onclick="copyCode()">Скопировать код</button>
            <button class="btn-back" style="width:100%;" onclick="document.getElementById('editor-panel').style.display='none'">Закрыть</button>
        </div>
    </div>

    <script src="script.js?v=64"></script>
    <script>
        if (!player.race || player.race === '') {
            window.location.href = 'index.html';
        } else {
            document.getElementById('character').src = player.race;
        }

        function applySettings() {
            let hatImg = document.getElementById('equipped-hat');
            if (player.equippedHat && allHats[player.equippedHat]) {
                hatImg.src = allHats[player.equippedHat].img;
                hatImg.style.display = 'block';
                let raceHats = HAT_SETTINGS[player.race] || {};
                let hs = raceHats[player.equippedHat] || { w: 220, y: 60, x: 50 };
                hatImg.style.width = hs.w + 'px'; hatImg.style.top = hs.y + 'px'; hatImg.style.left = hs.x + '%';
                let tier = player.hatTiers[player.equippedHat] || 0;
                hatImg.className = tier === 1 ? 'tier-bronze' : (tier === 2 ? 'tier-silver' : (tier === 3 ? 'tier-gold' : (tier === 4 ? 'tier-diamond' : '')));
            }

            let artImg = document.getElementById('equipped-artifact');
            if (player.equippedArtifact && allArtifacts[player.equippedArtifact]) {
                artImg.src = allArtifacts[player.equippedArtifact].img;
                artImg.style.display = 'block';
                let raceArts = ARTIFACT_SETTINGS[player.race] || {};
                let as = raceArts[player.equippedArtifact] || { w: 110, y: 10, x: -30 };
                artImg.style.width = as.w + 'px'; artImg.style.bottom = as.y + 'px'; artImg.style.right = as.x + 'px';
                let tier = player.artifactTiers[player.equippedArtifact] || 0;
                artImg.className = tier === 1 ? 'tier-bronze' : (tier === 2 ? 'tier-silver' : (tier === 3 ? 'tier-gold' : (tier === 4 ? 'tier-diamond' : '')));
            }
        }

        applySettings();
        updateBalanceUI();
        startTimerUI('ui-boost-timer');

        if (sessionStorage.getItem('openEditor') === 'true') {
            sessionStorage.removeItem('openEditor');
            setTimeout(() => { openEditor(); }, 500); 
        }

        let tempHatSettings = JSON.parse(JSON.stringify(HAT_SETTINGS));
        let tempArtSettings = JSON.parse(JSON.stringify(ARTIFACT_SETTINGS));
        let editorRace = player.race;

        function openEditor() {
            editorRace = player.race;
            document.getElementById('editor-race-selector').value = editorRace;
            let selector = document.getElementById('item-selector');
            selector.innerHTML = '<option value="">-- Выберите предмет --</option>';
            selector.innerHTML += '<optgroup label="Шапки">';
            for (let id in allHats) {
                let selected = (id === player.equippedHat) ? 'selected' : '';
                selector.innerHTML += `<option value="hat_${id}" ${selected}>Шапка: ${allHats[id].name}</option>`;
            }
            selector.innerHTML += '</optgroup>';
            selector.innerHTML += '<optgroup label="Артефакты">';
            for (let id in allArtifacts) {
                let selected = (id === player.equippedArtifact) ? 'selected' : '';
                selector.innerHTML += `<option value="art_${id}" ${selected}>Артефакт: ${allArtifacts[id].name}</option>`;
            }
            selector.innerHTML += '</optgroup>';
            document.getElementById('editor-panel').style.display = 'flex';
            if (selector.value) loadItemToEditor();
        }

        function changeEditorRace(race) {
            editorRace = race;
            document.getElementById('character').src = editorRace;
            applySettings();
            loadItemToEditor();
        }

        function loadItemToEditor() {
            let val = document.getElementById('item-selector').value;
            let box = document.getElementById('sliders-container');
            box.innerHTML = ''; document.getElementById('code-output').style.display = 'none';
            if (!val) return;

            let isHat = val.startsWith('hat_'); let id = val.replace('hat_', '').replace('art_', '');
            let data = isHat ? (tempHatSettings[editorRace] && tempHatSettings[editorRace][id]) : (tempArtSettings[editorRace] && tempArtSettings[editorRace][id]);
            let defaults = isHat ? { w: 220, y: 60, x: 50 } : { w: 110, y: 10, x: -30 };
            let settings = data || defaults;

            let yLabel = isHat ? 'Верх (Y)' : 'Низ (Y)'; let xLabel = isHat ? 'Центр (X)' : 'Сдвиг (X)';
            let xMin = isHat ? 0 : -150; let xMax = isHat ? 100 : 50; let maxW = isHat ? 350 : 250;

            box.innerHTML = `
                <div class="slider-group"><label>Размер</label><input type="range" min="30" max="${maxW}" value="${settings.w}" oninput="previewChange('${val}', 'w', this.value, ${isHat})"><span>${settings.w}</span></div>
                <div class="slider-group"><label>${yLabel}</label><input type="range" min="-100" max="200" value="${settings.y}" oninput="previewChange('${val}', 'y', this.value, ${isHat})"><span>${settings.y}</span></div>
                <div class="slider-group"><label>${xLabel}</label><input type="range" min="${xMin}" max="${xMax}" value="${settings.x}" oninput="previewChange('${val}', 'x', this.value, ${isHat})"><span>${settings.x}</span></div>
            `;
            if (isHat) player.equippedHat = id; else player.equippedArtifact = id;
            applySettings();
        }

        function previewChange(val, key, num, isHat) {
            let id = val.replace('hat_', '').replace('art_', '');
            let numVal = parseInt(num); event.target.nextElementSibling.innerText = numVal;
            if (isHat) {
                if (!tempHatSettings[editorRace]) tempHatSettings[editorRace] = {};
                if (!tempHatSettings[editorRace][id]) tempHatSettings[editorRace][id] = { w: 220, y: 60, x: 50 };
                tempHatSettings[editorRace][id][key] = numVal; applySettings();
            } else {
                if (!tempArtSettings[editorRace]) tempArtSettings[editorRace] = {};
                if (!tempArtSettings[editorRace][id]) tempArtSettings[editorRace][id] = { w: 110, y: 10, x: -30 };
                tempArtSettings[editorRace][id][key] = numVal; applySettings();
            }
        }

        let isDraggingMode = false; let activeEditEl = null; let activeEditType = null;
        let startTouchX = 0, startTouchY = 0, startObjX = 0, startObjY = 0, pinchStartDist = 0, startObjWidth = 0;

        function startDragging() {
            let val = document.getElementById('item-selector').value;
            if (!val) { showToast("Выберите предмет!", true); return; }
            document.getElementById('editor-panel').style.display = 'none';
            document.getElementById('drag-banner').style.display = 'block';
            isDraggingMode = true;
            if (val.startsWith('hat_')) { activeEditType = 'hat'; activeEditEl = document.getElementById('equipped-hat'); } 
            else { activeEditType = 'art'; activeEditEl = document.getElementById('equipped-artifact'); }
            activeEditEl.classList.add('editing-item');
        }

        function finishDragging() {
            document.getElementById('drag-banner').style.display = 'none'; isDraggingMode = false;
            if (activeEditEl) activeEditEl.classList.remove('editing-item');
            if (activeEditType === 'hat') {
                let id = player.equippedHat;
                if(!tempHatSettings[editorRace]) tempHatSettings[editorRace] = {};
                if(!tempHatSettings[editorRace][id]) tempHatSettings[editorRace][id] = { w: 220, y: 60, x: 50 };
                tempHatSettings[editorRace][id].y = Math.round(parseFloat(activeEditEl.style.top) || 60);
                tempHatSettings[editorRace][id].x = Math.round(parseFloat(activeEditEl.style.left) || 50);
                tempHatSettings[editorRace][id].w = Math.round(parseFloat(activeEditEl.style.width) || 220);
            } else if (activeEditType === 'art') {
                let id = player.equippedArtifact;
                if(!tempArtSettings[editorRace]) tempArtSettings[editorRace] = {};
                if(!tempArtSettings[editorRace][id]) tempArtSettings[editorRace][id] = { w: 110, y: 10, x: -30 };
                tempArtSettings[editorRace][id].y = Math.round(parseFloat(activeEditEl.style.bottom) || 10);
                tempArtSettings[editorRace][id].x = Math.round(parseFloat(activeEditEl.style.right) || -30);
                tempArtSettings[editorRace][id].w = Math.round(parseFloat(activeEditEl.style.width) || 110);
            }
            document.getElementById('editor-panel').style.display = 'flex';
            loadItemToEditor();
        }

        document.getElementById('tap-area').addEventListener('touchstart', (e) => {
            if (!isDraggingMode || !activeEditEl) return; e.preventDefault();
            if (e.touches.length === 1) {
                startTouchX = e.touches[0].clientX; startTouchY = e.touches[0].clientY;
                if (activeEditType === 'hat') { startObjX = parseFloat(activeEditEl.style.left) || 50; startObjY = parseFloat(activeEditEl.style.top) || 60; } 
                else { startObjX = parseFloat(activeEditEl.style.right) || -30; startObjY = parseFloat(activeEditEl.style.bottom) || 10; }
            } else if (e.touches.length === 2) {
                pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                startObjWidth = parseFloat(activeEditEl.style.width) || 100;
            }
        }, {passive: false});

        document.getElementById('tap-area').addEventListener('touchmove', (e) => {
            if (!isDraggingMode || !activeEditEl) return; e.preventDefault();
            if (e.touches.length === 1) {
                let dx = e.touches[0].clientX - startTouchX; let dy = e.touches[0].clientY - startTouchY;
                if (activeEditType === 'hat') {
                    activeEditEl.style.top = (startObjY + dy) + 'px';
                    activeEditEl.style.left = (startObjX + (dx / window.innerWidth * 100)) + '%';
                } else {
                    activeEditEl.style.bottom = (startObjY - dy) + 'px';
                    activeEditEl.style.right = (startObjX - dx) + 'px';
                }
            } else if (e.touches.length === 2) {
                let currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                let scale = currentDist / pinchStartDist; let newWidth = startObjWidth * scale;
                if (newWidth > 20 && newWidth < 500) activeEditEl.style.width = newWidth + 'px';
            }
        }, {passive: false});

        function generateCode() {
            let out = document.getElementById('code-output');
            let hatCode = "const HAT_SETTINGS = {\n";
            for (let race in tempHatSettings) {
                hatCode += `    '${race}': {\n`;
                for (let id in tempHatSettings[race]) {
                    let hs = tempHatSettings[race][id];
                    hatCode += `        '${id}': { w: ${hs.w}, y: ${hs.y}, x: ${hs.x} },\n`;
                }
                hatCode += `    },\n`;
            }
            hatCode += "};\n\n";
            let artCode = "const ARTIFACT_SETTINGS = {\n";
            for (let race in tempArtSettings) {
                artCode += `    '${race}': {\n`;
                for (let id in tempArtSettings[race]) {
                    let as = tempArtSettings[race][id];
                    artCode += `        '${id}': { w: ${as.w}, y: ${as.y}, x: ${as.x} },\n`;
                }
                artCode += `    },\n`;
            }
            artCode += "};";
            out.value = hatCode + artCode; out.style.display = 'block';
        }

        function copyCode() {
            let out = document.getElementById('code-output');
            if (!out.value) { showToast("Сначала нажмите 'Сгенерировать'", true); return; }
            out.select(); document.execCommand('copy'); showToast("Скопировано! Вставьте в script.js");
        }

        function tap(event) {
            if (isDraggingMode) return; 
            playSound('tap'); 
            vibrate(20); 

            let bonuses = getEquippedStats();
            let baseFuzes = 5 + bonuses.addFuzes;
            let earned = Math.floor(baseFuzes * getCurrentMultiplier()); 
            let rubyChance = (2 + bonuses.addRubyChance) / 100;
            let isRuby = Math.random() < rubyChance; 

            player.fuzes += earned; 
            if (isRuby) player.rubies += 1;
            updateBalanceUI(); saveGame();
            
            let clientX = event.clientX; let clientY = event.clientY;
            
            let particleCount = 6;
            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.className = 'tap-particle';
                let angle = Math.random() * Math.PI * 2;
                let distance = 40 + Math.random() * 60;
                particle.style.setProperty('--tx', (Math.cos(angle) * distance) + 'px');
                particle.style.setProperty('--ty', (Math.sin(angle) * distance) + 'px');
                particle.style.left = (clientX - 6) + 'px';
                particle.style.top = (clientY - 6) + 'px';
                if (isRuby) particle.style.background = 'radial-gradient(circle, #FF5555, #AA0000)';
                else particle.style.background = 'radial-gradient(circle, #FFD700, #FF8C00)';
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }

            let text = document.createElement('div'); text.className = 'floating-text';
            if (isRuby) { text.innerHTML = `+1 <img src="images/rubin.png">`; } 
            else { text.innerHTML = `+${earned} <img src="images/fuz.png">`; }
            text.style.left = (clientX - 30) + 'px'; text.style.top = (clientY - 30) + 'px';
            document.body.appendChild(text); setTimeout(() => text.remove(), 800);
        }

        const fuzImg = '<img src="images/fuz.png" class="coin-icon" style="width:16px; height:16px; margin-bottom:0;">';
        const rubImg = '<img src="images/rubin.png" class="coin-icon" style="width:16px; height:16px; margin-bottom:0;">';
        
        // НОВЫЕ ЕЖЕДНЕВНЫЕ БОНУСЫ С ИКОНКАМИ
        const bonusRewards = [
            { text: `5000 ${fuzImg}`, type: "fuzes", amount: 5000 },
            { text: `30 ${rubImg}`, type: "rubies", amount: 30 },
            { text: `10000 ${fuzImg}`, type: "fuzes", amount: 10000 },
            { text: `40 ${rubImg}`, type: "rubies", amount: 40 },
            { text: "x2 ⚡ (10м)", type: "boost", mult: 2, time: 10 },
            { text: `20000 ${fuzImg}`, type: "fuzes", amount: 20000 },
            { text: `30 ${rubImg} + 30000 ${fuzImg}`, type: "mix", rubies: 30, fuzes: 30000 }
        ];
        
        const COOLDOWN = 24 * 60 * 60 * 1000; let canClaim = false;
        function checkDailyBonus() {
            if (Date.now() - player.lastBonusTime >= COOLDOWN) {
                canClaim = true; renderBonusGrid(); document.getElementById('bonus-modal').style.display = 'flex';
            }
        }
        function renderBonusGrid() {
            let grid = document.getElementById('bonus-days'); grid.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                let dayNum = i + 1, isCurrent = (player.bonusDay === dayNum), isPassed = (player.bonusDay > dayNum);
                let div = document.createElement('div'); div.className = 'bonus-day';
                if (isCurrent && canClaim) div.classList.add('active');
                if (!isCurrent && !isPassed) div.classList.add('locked');
                if (isPassed) div.classList.add('passed');
                div.innerHTML = `<div style="font-size:12px; margin-bottom:5px;">День ${dayNum}</div><div style="font-size:14px; font-weight:bold; display:flex; align-items:center; justify-content:center; gap:2px;">${bonusRewards[i].text}</div>`;
                grid.appendChild(div);
            }
        }
        document.getElementById('claim-bonus-btn').onclick = () => {
            if (!canClaim) return;
            let reward = bonusRewards[player.bonusDay - 1];
            if (reward.type === 'fuzes') player.fuzes += reward.amount;
            else if (reward.type === 'rubies') player.rubies += reward.amount;
            else if (reward.type === 'boost') {
                player.boostMultiplier = reward.mult; let now = Date.now();
                if (player.boostEndTime > now) { player.boostEndTime += reward.time * 60000; } else { player.boostEndTime = now + (reward.time * 60000); }
                startTimerUI('ui-boost-timer');
            } else if (reward.type === 'mix') { player.rubies += reward.rubies; player.fuzes += reward.fuzes; }
            player.bonusDay++; if (player.bonusDay > 7) player.bonusDay = 1;
            player.lastBonusTime = Date.now(); saveGame(); updateBalanceUI(); showToast("Бонус получен!");
            document.getElementById('bonus-modal').style.display = 'none'; canClaim = false;
        };
        setTimeout(checkDailyBonus, 500);
    </script>
    <script>
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.StatusBar) {
            window.Capacitor.Plugins.StatusBar.hide();
        }
    </script>
</body>
</html>
